<div class="dashboard-container">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="user-profile">
      <img src="assets/ah.jpg" alt="User Image" class="profile-img">
      <h3>Edgar Junes</h3>
      <span>Admin</span>
    </div>
    <nav class="menu">
      <a routerLink="/inicio" class="menu-item">
        <i class="icon-home"></i> Inicio
      </a>
      <a routerLink="/categorias" class="menu-item" routerLinkActive="active">
        <i class="icon-category"></i> Categorías
      </a>
      <a routerLink="/productos" class="menu-item">
        <i class="icon-products"></i> Productos
      </a>
      <a routerLink="/clientes" class="menu-item">
        <i class="icon-clients"></i> Clientes
      </a>
      <a routerLink="/inventarios" class="menu-item">
        <i class="icon-inventory"></i> Inventarios
      </a>
      <a routerLink="/compras" class="menu-item">
        <i class="fas fa-credit-card"></i> Pago
      </a>
      <a routerLink="/ordenes" class="menu-item">
        <i class="fas fa-shopping-cart"></i> Órdenes
      </a>
      <a routerLink="/configuracion" class="menu-item">
        <i class="icon-settings"></i> Configuración
      </a>
    </nav>
    <button class="logout-button">Logout</button>
  </div>

    <!-- Main Content -->
    <div class="main-content">
      <header class="header">
        <div class="title-container">
          <h2>Categorías</h2>
        </div>
        <div class="actions-container">
          <!-- Búsqueda -->
          <input
            type="text"
            placeholder="Buscar por nombre"
            [(ngModel)]="searchText"
            (input)="filterCategories()"
            class="search-box"
          />
          <!-- Toggle -->
          <div class="toggle-container">
            <label class="switch">
              <input
                type="checkbox"
                [(ngModel)]="showActive"
                (ngModelChange)="toggleCategoryView()"
              />
              <span class="slider round"></span>
            </label>
            <span>{{ showActive ? 'Listando Activas' : 'Listando Inactivas' }}</span>
          </div>

        <!-- Botones de exportación -->
        <div class="export-buttons">
          <button class="export-button" (click)="exportToPDF()">Exportar a PDF</button>
          <button class="export-button" (click)="exportToExcel()">Exportar a Excel</button>
        </div>
        
          <!-- Botón de nueva categoría -->
          <button class="new-category-button" (click)="createNewCategory()">
            + Nueva Categoría
          </button>
        </div>
      </header>
      <div class="categories-list">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Nombre</th>
              <th>Descripción</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let category of filteredCategories; let i = index">
              <td>{{ i + 1 }}</td>
              <td>{{ category.categoryName }}</td>
              <td>{{ category.description }}</td>
              <td>
                <button (click)="editCategory(category)">✏️</button>
                <button *ngIf="showActive" (click)="deactivateCategory(category.id)">🗑️</button>
                <button *ngIf="!showActive" (click)="activateCategory(category.id)">♻️</button>
              </td>              
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
