<div class="container mt-4">
  <h2>Listado de Clientes</h2>
  <a routerLink="/dashboard/customers/form" class="btn btn-primary mb-3">Agregar Cliente</a>
  <table class="table table-striped">
    <thead>
      <tr>
        <th>DNI</th><th>Nombre</th><th>Email</th><th>Teléfono</th><th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let customer of customers">
        <td>{{ customer.nationalId }}</td>
        <td>{{ customer.firstName }} {{ customer.lastName }}</td>
        <td>{{ customer.email }}</td>
        <td>{{ customer.phone }}</td>
        <td>
          <a [routerLink]="['/dashboard/customers/form', customer.clientId]" class="btn btn-sm btn-warning">Editar</a>
          <button class="btn btn-sm btn-danger" (click)="deleteCustomer(customer.clientId!)">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
