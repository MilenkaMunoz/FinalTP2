<div class="sale-form-container">
  <h2>{{ isEdit ? 'Editar Venta' : 'Registrar Venta' }}</h2>
  <form (ngSubmit)="onSubmit()" #saleForm="ngForm">
    <div class="form-row">
      <label>Código:</label>
      <input [(ngModel)]="sale.saleCode" name="saleCode" required />
    </div>
    <div class="form-row">
      <label>Cliente:</label>
      <input [(ngModel)]="sale.clientName" name="clientName" required />
    </div>
    <div class="form-row">
      <label>Método de Pago:</label>
      <input [(ngModel)]="sale.paymentMethod" name="paymentMethod" required />
    </div>
    <div class="form-row">
      <label>Observaciones:</label>
      <input [(ngModel)]="sale.remarks" name="remarks" />
    </div>
    <div class="form-row">
      <label>Estado:</label>
      <select [(ngModel)]="sale.status" name="status">
        <option value="Registrado">Registrado</option>
        <option value="Anulado">Anulado</option>
      </select>
    </div>
    <h3>Detalles</h3>
    <table class="details-table">
      <thead>
        <tr>
          <th>Producto</th>
          <th>Cantidad</th>
          <th>Precio Unitario</th>
          <th>Total</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let d of sale.details; let i = index">
          <td><input [(ngModel)]="d.productName" name="productName{{i}}" required /></td>
          <td><input type="number" [(ngModel)]="d.quantity" name="quantity{{i}}" (input)="updateTotal(d)" min="1" required /></td>
          <td><input type="number" [(ngModel)]="d.unitPrice" name="unitPrice{{i}}" (input)="updateTotal(d)" min="0" required /></td>
          <td>{{ d.totalPrice | number:'1.2-2' }}</td>
          <td><button type="button" (click)="removeDetail(i)">Eliminar</button></td>
        </tr>
      </tbody>
    </table>
    <button type="button" (click)="addDetail()">Agregar Detalle</button>
    <div class="form-actions">
      <button type="submit" [disabled]="!saleForm.form.valid">{{ isEdit ? 'Actualizar' : 'Registrar' }}</button>
      <button type="button" (click)="router.navigate(['/dashboard/sales'])">Cancelar</button>
    </div>
  </form>
</div>
